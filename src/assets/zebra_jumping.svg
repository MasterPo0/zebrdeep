<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g filter="drop-shadow(0px 12px 18px rgba(0,0,0,0.18))" transform="translate(10, 10)">
    
    <!-- Barrier / Hurdle below -->
    <g transform="translate(140, 360)">
      <rect x="0" y="0" width="160" height="20" fill="#E2E8F0" stroke="#0F1216" stroke-width="4" rx="4" />
      <rect x="20" y="20" width="14" height="100" fill="#94A3B8" stroke="#0F1216" stroke-width="3" />
      <rect x="126" y="20" width="14" height="100" fill="#94A3B8" stroke="#0F1216" stroke-width="3" />
      <!-- Speed motion dashes -->
      <line x1="-30" y1="10" x2="-10" y2="10" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
      <line x1="-50" y1="30" x2="-20" y2="30" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 2. Hurdling Zebra Mascot (Mid-air Stride) -->
    <!-- Extended Back Leg -->
    <path d="M 160,250 L 80,300 L 100,320 L 180,270 Z" fill="#1E242B" />
    <path d="M 60,310 C 50,320 70,335 100,330 C 110,320 100,300 70,300 Z" fill="#0F1216" />

    <!-- Bent Forward Leg -->
    <path d="M 230,250 L 320,210 L 370,290 L 340,300 Z" fill="#28303B" />
    <path d="M 360,295 C 370,285 410,305 435,320 C 445,330 435,350 405,350 C 375,350 355,325 360,295 Z" fill="#F8FAFC" stroke="#0F1216" stroke-width="3" />

    <!-- Torso angled dynamically for jump -->
    <path d="M 180,150 Q 230,170 270,140 L 260,270 L 170,260 Z" fill="#F8FAFC" />
    <path d="M 160,145 C 150,190 155,240 180,275 L 200,275 L 190,150 Z" fill="#18202A" />
    <path d="M 280,135 C 290,180 285,230 255,270 L 235,270 L 255,140 Z" fill="#18202A" />

    <!-- Arms spread for balance -->
    <path d="M 160,150 Q 120,180 100,210 L 115,220 Q 135,190 170,165 Z" fill="#18202A" />
    <circle cx="95" cy="220" r="12" fill="#2D3748" />

    <path d="M 270,140 Q 320,160 350,170 L 345,185 Q 315,175 260,155 Z" fill="#18202A" />
    <circle cx="360" cy="175" r="12" fill="#2D3748" />

    <!-- Head -->
    <path d="M 215,135 L 265,135 L 260,95 L 220,95 Z" fill="#F8FAFC" />
    <path d="M 210,100 C 220,70 235,45 255,25 C 275,5 300,10 310,30 C 320,50 300,85 265,110 Z" fill="#F8FAFC" stroke="#0F1216" stroke-width="3" />
    <path d="M 285,23 C 297,17 313,23 317,40 C 320,53 305,67 290,69 C 280,55 277,35 285,23 Z" fill="#15181C" />

    <!-- Eye -->
    <ellipse cx="271" cy="43" rx="6" ry="4.5" fill="#0F1216" />
    <circle cx="272" cy="42" r="2" fill="#FFFFFF" />

    <!-- Mane -->
    <path d="M 210,105 L 217,90 L 227,70 L 237,50 L 247,30 L 257,10 L 263,0 L 255,7 L 245,25 L 235,45 L 225,65 L 215,85 Z" fill="#0F1216" />

  </g>
</svg>
