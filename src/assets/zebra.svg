<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <!-- Soft shadow filter -->
    <filter id="humanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#humanShadow)" transform="translate(10, 10)">
    <!-- Ground Shadow under Sneakers -->
    <ellipse cx="250" cy="540" rx="140" ry="12" fill="#000000" opacity="0.15" />

    <!-- 1. LEFT LEG & SNEAKER (Back Stride) -->
    <g id="leftLeg">
      <!-- Pants Left Leg -->
      <path d="M 230,310 L 170,450 L 205,465 L 260,315 Z" fill="#1E242B" />
      <!-- Pants creases -->
      <path d="M 215,350 L 195,390" stroke="#0F1216" stroke-width="3" stroke-linecap="round" />
      <path d="M 200,410 L 185,435" stroke="#0F1216" stroke-width="3" stroke-linecap="round" />

      {/* Sock */}
      <rect x="172" y="445" width="25" height="15" fill="#F8FAFC" rx="3" />

      {/* Left Sneaker */}
      <path d="M 150,455 C 145,465 155,485 185,485 C 205,485 210,470 205,458 C 195,455 175,453 150,455 Z" fill="#0F1216" />
      <path d="M 152,475 C 165,475 195,475 204,470 L 202,478 C 185,482 165,482 152,478 Z" fill="#F8FAFC" />
      <!-- Sneaker Sole & Laces -->
      <path d="M 175,458 L 188,468" stroke="#F8FAFC" stroke-width="2" />
      <path d="M 180,455 L 193,465" stroke="#F8FAFC" stroke-width="2" />
    </g>

    <!-- 2. RIGHT LEG & SNEAKER (Forward Power Stride) -->
    <g id="rightLeg">
      <!-- Pants Right Leg -->
      <path d="M 270,310 L 350,430 L 385,410 L 295,300 Z" fill="#28303B" />
      <!-- Pants Fold wrinkles -->
      <path d="M 290,330 L 325,370" stroke="#161A20" stroke-width="4" stroke-linecap="round" />
      <path d="M 320,380 L 355,410" stroke="#161A20" stroke-width="4" stroke-linecap="round" />

      {/* Sock */}
      <rect x="345" y="415" width="25" height="18" fill="#F8FAFC" rx="3" transform="rotate(-25 345 415)" />

      {/* Right Sneaker (Pointing forward) */}
      <g transform="translate(10, 0)">
        <path d="M 345,410 C 355,400 395,420 425,435 C 435,445 425,465 395,465 C 365,465 345,440 345,410 Z" fill="#F8FAFC" stroke="#0F1216" stroke-width="3" />
        <path d="M 355,450 C 375,452 410,452 422,442 L 418,458 C 395,465 365,465 352,458 Z" fill="#0F1216" />
        <!-- Sneaker Accent Lines -->
        <path d="M 370,420 C 385,430 400,435 410,438" stroke="#0F1216" stroke-width="3" fill="none" />
      </g>
    </g>

    <!-- 3. TRACK JACKET TORSO & INNER SHIRT -->
    <g id="torso">
      <!-- Inner White T-Shirt -->
      <path d="M 230,170 Q 260,190 290,170 L 295,315 L 225,315 Z" fill="#F8FAFC" />
      <!-- T-shirt collar fold -->
      <path d="M 240,175 Q 260,195 280,175" fill="none" stroke="#E2E8F0" stroke-width="3" />

      <!-- Stylish Tracksuit Jacket (Dark Blue / Charcoal with White Stripes) -->
      <path d="M 200,165 C 190,220 195,280 225,310 L 250,310 L 235,175 Z" fill="#18202A" />
      <path d="M 320,165 C 330,220 325,280 295,310 L 270,310 L 285,175 Z" fill="#18202A" />

      <!-- Jacket Collar Stand -->
      <path d="M 210,160 L 235,175 L 235,145 Z" fill="#24303E" />
      <path d="M 310,160 L 285,175 L 285,145 Z" fill="#24303E" />

      <!-- Iconic White Zebra Stripes on Jacket Shoulders -->
      <path d="M 205,175 Q 220,195 228,215 L 220,220 Q 210,198 198,180 Z" fill="#F8FAFC" />
      <path d="M 202,195 Q 215,215 224,235 L 216,240 Q 205,218 195,200 Z" fill="#F8FAFC" />
      
      <path d="M 315,175 Q 300,195 292,215 L 300,220 Q 310,198 322,180 Z" fill="#F8FAFC" />
      <path d="M 318,195 Q 305,215 296,235 L 304,240 Q 315,218 325,200 Z" fill="#F8FAFC" />
    </g>

    <!-- 4. LEFT ARM (Gloved Hand resting back) -->
    <g id="leftArm">
      <path d="M 205,170 Q 170,220 160,270 L 180,275 Q 190,230 220,185 Z" fill="#18202A" />
      <!-- White Sleeve Stripe -->
      <path d="M 195,190 Q 175,230 168,265 L 173,267 Q 180,232 200,193 Z" fill="#F8FAFC" />
      <!-- Cuff -->
      <rect x="156" y="268" width="25" height="12" fill="#0F1216" rx="2" transform="rotate(-15 156 268)" />
      <!-- Gloved Hand -->
      <path d="M 152,278 C 145,285 140,305 155,310 C 165,310 172,295 168,280 Z" fill="#2D3748" />
    </g>

    <!-- 5. RIGHT ARM (Pointing Finger Hand extended forward!) -->
    <g id="rightArm">
      <path d="M 305,170 Q 350,200 375,210 L 370,230 Q 340,218 295,185 Z" fill="#18202A" />
      <!-- White Sleeve Stripe -->
      <path d="M 315,180 Q 350,206 370,215 L 368,220 Q 348,211 312,185 Z" fill="#F8FAFC" />
      <!-- Cuff -->
      <rect x="365" y="210" width="14" height="22" fill="#0F1216" rx="2" transform="rotate(20 365 210)" />
      
      <!-- Gloved Hand with POINTING INDEX FINGER -->
      <g transform="translate(370, 205) rotate(10)">
        {/* Palm & Fist */}
        <path d="M 0,5 C 5,-5 25,-5 28,8 C 28,18 15,22 0,18 Z" fill="#2D3748" />
        {/* Extended Pointing Index Finger */}
        <path d="M 22,-2 C 32,-4 52,-2 55,4 C 55,10 38,11 25,8 Z" fill="#2D3748" />
        <!-- Index Finger Highlight -->
        <path d="M 25,0 L 50,2" stroke="#4A5568" stroke-width="2" />
      </g>
    </g>

    <!-- 6. HUMAN ZEBRA HEAD (Realistic detailed Zebra head on shoulders) -->
    <g id="zebraHead">
      <!-- Neck -->
      <path d="M 240,155 L 280,155 L 275,120 L 245,120 Z" fill="#F8FAFC" />
      <path d="M 245,140 L 275,140" stroke="#0F1216" stroke-width="4" />
      <path d="M 248,128 L 272,128" stroke="#0F1216" stroke-width="4" />

      <!-- Head Base Contour -->
      <path d="M 235,125 C 245,95 260,70 280,50 C 300,30 325,35 335,55 C 345,75 325,110 290,135 Z" fill="#F8FAFC" stroke="#0F1216" stroke-width="3" />

      <!-- Dark Snout / Muzzle -->
      <path d="M 310,48 C 322,42 338,48 342,65 C 345,78 330,92 315,94 C 305,80 302,60 310,48 Z" fill="#15181C" />
      <ellipse cx="330" cy="62" rx="3.5" ry="2.5" fill="#050607" />

      <!-- Facial Zebra Stripes -->
      <g fill="#0F1216">
        <path d="M 260,105 C 275,88 290,75 302,62 L 305,67 C 293,80 279,93 264,110 Z" />
        <path d="M 252,118 C 267,101 282,88 295,76 L 298,81 C 285,93 270,107 256,123 Z" />
        <path d="M 245,128 C 260,113 274,101 286,90 L 289,95 C 277,106 263,119 249,133 Z" />
      </g>

      <!-- Expressive Eye -->
      <g>
        <ellipse cx="296" cy="68" rx="6" ry="4.5" fill="#0F1216" />
        <circle cx="297" cy="67" r="2" fill="#FFFFFF" />
      </g>

      <!-- Ears -->
      <g stroke="#0F1216" stroke-width="2">
        <path d="M 255,50 C 250,28 262,10 270,16 C 274,28 266,45 259,52 Z" fill="#F8FAFC" />
        <path d="M 268,45 C 268,22 282,5 292,12 C 294,26 284,42 274,48 Z" fill="#F8FAFC" />
      </g>

      <!-- Upright Mohawked Zebra Mane -->
      <path d="M 235,130 L 242,115 L 252,95 L 262,75 L 272,55 L 282,35 L 288,25 L 280,32 L 270,50 L 260,70 L 250,90 L 240,110 Z" fill="#0F1216" />
    </g>

  </g>
</svg>
